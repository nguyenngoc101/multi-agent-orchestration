name: registry-guard

# Two jobs:
#  1. Validate task-registry.json: cycles, missing deps, scope overlap, print waves.
#  2. Enforce scope: a feature/<id> PR may only change files in that task's scope.allow.
on:
  pull_request:
    branches: [develop]
  merge_group:
  push:
    paths: ["task-registry.json"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      # Never execute validator code supplied by the candidate change.
      - uses: actions/checkout@v4
        with:
          ref: develop
          path: trusted
      - name: Check candidate registry with trusted validator
        run: python3 trusted/scripts/check-registry.py candidate/task-registry.json

  enforce-scope:
    # Only runs for PRs from feature/* branches
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
      # Policy and enforcement code must come from the immutable PR base.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
      - name: Enforce file scope using trusted base policy
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # task id = the part after 'feature/'
          TASK_ID="${HEAD_REF#feature/}"
          echo "Task: $TASK_ID"
          cd candidate
          python3 ../trusted/scripts/enforce-scope.py \
            --registry ../trusted/task-registry.json \
            --task "$TASK_ID" \
            --base "$BASE_SHA" --head "$HEAD_SHA"
